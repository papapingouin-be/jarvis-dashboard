<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis Dark logo</title>
  <desc id="desc">A minimalist original geometric assistant mark with a cyan core and violet orbit.</desc>
  <defs>
    <linearGradient id="core" x1="64" y1="48" x2="192" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CE7FF"/>
      <stop offset="0.55" stop-color="#38D5FF"/>
      <stop offset="1" stop-color="#8C7CFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#05070D"/>
  <path d="M128 31 204 75v88l-76 62-76-62V75l76-44Z" fill="#101522" stroke="rgba(124,231,255,.28)" stroke-width="6"/>
  <path d="M128 64 174 91v55l-46 38-46-38V91l46-27Z" fill="none" stroke="url(#core)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="24" fill="url(#core)"/>
  <path d="M70 176c34 20 82 20 116 0" fill="none" stroke="#48E6A4" stroke-width="8" stroke-linecap="round" opacity=".78"/>
  <path d="M64 82c40-23 88-23 128 0" fill="none" stroke="#8C7CFF" stroke-width="6" stroke-linecap="round" opacity=".68"/>
</svg>
