# JARVIS Dashboard - Mission Control (v0.3)
# Single official screenshot screen. No secondary views are defined here.
title: Mission Control
views:
  - title: Mission Control
    path: mission-control
    icon: mdi:rocket-launch-outline
    type: custom:grid-layout
    badges: []
    layout:
      grid-template-columns: minmax(260px, 25%) minmax(420px, 1fr) minmax(260px, 25%)
      grid-template-areas: |
        "header header header"
        "left mission right"
        "left console right"
        "footer footer footer"
      grid-template-rows: auto minmax(420px, auto) minmax(230px, auto) auto
      grid-gap: 20px
      margin: 0
      padding: 28px
      mediaquery:
        "(max-width: 1100px)":
          grid-template-columns: 1fr
          grid-template-areas: |
            "header"
            "mission"
            "console"
            "left"
            "right"
            "footer"
    cards:
      - type: markdown
        view_layout: { grid-area: header }
        content: |
          <div class="mc-header">
            <img src="/local/jarvis/logo.svg" alt="Jarvis" />
            <div><strong>Mission Control</strong><span>jarvis-core · 14:32 UTC</span></div>
          </div>
        card_mod:
          style: |
            ha-card { background: linear-gradient(145deg, rgba(16,21,34,.92), rgba(8,11,20,.82)); border: 1px solid rgba(124,231,255,.18); border-radius: 24px; box-shadow: 0 18px 48px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.04); color: var(--jarvis-color-text, #EAF6FF); overflow: hidden; }
            .mc-header { display:flex; align-items:center; justify-content:space-between; gap:14px; letter-spacing:.02em; }
            .mc-header img { width:38px; height:38px; filter:drop-shadow(0 0 14px rgba(56,213,255,.44)); }
            .mc-header strong { display:block; font-size:18px; text-transform:uppercase; }
            .mc-header span { display:block; color:#A9B7CA; font-size:12px; margin-top:3px; }
      - type: markdown
        title: SYSTEM STATE
        view_layout: { grid-area: left }
        content: |
          <div class="status-stack">
            <div class="status-card green"><ha-icon icon="mdi:robot-outline"></ha-icon><b>Codex</b><span>Actif</span><i></i></div>
            <div class="status-card green"><ha-icon icon="mdi:access-point-network"></ha-icon><b>MQTT</b><span>Connecté</span><i></i></div>
            <div class="status-card blue"><ha-icon icon="mdi:docker"></ha-icon><b>Docker</b><span>Prêt</span><i></i></div>
            <div class="status-card violet"><ha-icon icon="mdi:home-assistant"></ha-icon><b>Home Assistant</b><span>Synchronisé</span><i></i></div>
            <div class="status-card green"><ha-icon icon="mdi:github"></ha-icon><b>GitHub</b><span>Aligné</span><i></i></div>
          </div>
        card_mod:
          style: |
            ha-card { min-height:100%; background:linear-gradient(145deg,rgba(16,21,34,.92),rgba(8,11,20,.82)); border:1px solid rgba(124,231,255,.18); border-radius:24px; box-shadow:0 18px 48px rgba(0,0,0,.38); color:#EAF6FF; }
            .card-header { color:#7CE7FF; font-size:12px; letter-spacing:.14em; font-weight:800; }
            .status-stack { display:grid; gap:16px; }
            .status-card { position:relative; display:grid; grid-template-columns:42px 1fr auto; grid-template-areas:"icon name lamp" "icon state lamp"; gap:2px 14px; padding:17px 16px; border-radius:18px; background:rgba(27,35,53,.72); border:1px solid rgba(124,231,255,.14); }
            .status-card ha-icon { grid-area:icon; align-self:center; color:#38D5FF; filter:drop-shadow(0 0 10px rgba(56,213,255,.42)); }
            .status-card b { grid-area:name; font-size:15px; } .status-card span { grid-area:state; color:#A9B7CA; font-size:12px; }
            .status-card i { grid-area:lamp; width:11px; height:11px; border-radius:50%; align-self:center; background:#48E6A4; box-shadow:0 0 16px #48E6A4; animation:pulse 2.4s infinite; }
            .status-card.blue i { background:#38D5FF; box-shadow:0 0 16px #38D5FF; } .status-card.violet i { background:#8C7CFF; box-shadow:0 0 16px #8C7CFF; }
            @keyframes pulse { 50% { transform:scale(.72); opacity:.58; } }
      - type: markdown
        view_layout: { grid-area: mission }
        content: |
          <section class="mission-card"><p class="eyebrow">CURRENT MISSION</p><h1>Composer la capture officielle du dépôt</h1><p class="summary">Construction de l'écran principal Mission Control avec supervision visuelle, console vivante et chronologie opérationnelle.</p><div class="mission-grid"><div><span>Commande</span><b>npm run build</b></div><div><span>Outil</span><b>Codex CLI</b></div><div><span>Durée</span><b>12 min 42 s</b></div></div><div class="progress"><span></span></div><small>Progression simulée · 78%</small></section>
        card_mod:
          style: |
            ha-card { min-height:440px; background:radial-gradient(circle at 50% 0%,rgba(56,213,255,.24),transparent 42%),linear-gradient(145deg,rgba(21,27,43,.96),rgba(8,11,20,.9)); border:1px solid rgba(124,231,255,.22); border-radius:28px; box-shadow:0 24px 70px rgba(0,0,0,.48),0 0 44px rgba(56,213,255,.16); color:#EAF6FF; }
            .eyebrow { color:#7CE7FF; letter-spacing:.18em; font-size:13px; font-weight:900; margin:0 0 22px; } h1 { margin:0; font-size:clamp(32px,5vw,62px); line-height:1.02; letter-spacing:-.04em; text-shadow:0 0 34px rgba(56,213,255,.2); } .summary { color:#A9B7CA; font-size:18px; line-height:1.6; max-width:760px; margin:24px 0 30px; }
            .mission-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px; } .mission-grid div { border:1px solid rgba(124,231,255,.16); border-radius:18px; padding:16px; background:rgba(5,7,13,.36); }
            .mission-grid span, small { display:block; color:#6F7F96; text-transform:uppercase; letter-spacing:.12em; font-size:11px; } .mission-grid b { display:block; margin-top:8px; font-family:var(--jarvis-font-mono); }
            .progress { height:12px; border-radius:999px; background:rgba(124,231,255,.12); overflow:hidden; } .progress span { display:block; width:78%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#38D5FF,#8C7CFF,#48E6A4); animation:flow 2.6s ease-in-out infinite; } small { margin-top:12px; } @keyframes flow { 50% { filter:brightness(1.35); transform:translateX(2%); } } @media (max-width:900px){.mission-grid{grid-template-columns:1fr;}}
      - type: markdown
        view_layout: { grid-area: console }
        content: |
          <pre class="terminal"><code>[14:31:02] $ git status --short
          [14:31:04] ✓ workspace indexed
          [14:31:07] ▶ rendering Mission Control shell
          [14:31:11] ✎ dashboard/views/mission-control.yaml
          [14:31:18] ✓ timeline events hydrated
          [14:31:22] ✓ console stream attached
          [14:31:29] → awaiting validation signal</code></pre>
        card_mod:
          style: |
            ha-card { background:#02040A; border:1px solid rgba(72,230,164,.22); border-radius:22px; box-shadow:0 18px 42px rgba(0,0,0,.42),0 0 26px rgba(72,230,164,.08); } .terminal { margin:0; color:#B7FFD9; font-family:var(--jarvis-font-mono); font-size:13px; line-height:1.72; max-height:230px; overflow:auto; text-shadow:0 0 8px rgba(72,230,164,.22); } .terminal code { display:block; animation:reveal 6s steps(7,end) infinite; white-space:pre-wrap; } @keyframes reveal { 0%{clip-path:inset(0 0 100% 0);} 85%,100%{clip-path:inset(0);} }
      - type: markdown
        view_layout: { grid-area: right }
        content: |
          <div class="timeline"><div class="event green"><time>14:31</time><b>✔</b><span>Commande terminée</span></div><div class="event blue"><time>14:28</time><b>▶</b><span>Docker lancé</span></div><div class="event violet"><time>14:22</time><b>✎</b><span>daemon.json</span></div><div class="event amber"><time>14:16</time><b>⚠</b><span>Erreur contrôlée</span></div></div><div class="daily"><h3>Résumé du jour</h3><p><b>18</b><span>Commandes</span></p><p><b>7</b><span>Fichiers</span></p><p><b>42 min</b><span>Durée</span></p><p><b>1</b><span>Erreur</span></p></div>
        card_mod:
          style: |
            ha-card { min-height:100%; background:linear-gradient(145deg,rgba(16,21,34,.92),rgba(8,11,20,.82)); border:1px solid rgba(124,231,255,.18); border-radius:24px; box-shadow:0 18px 48px rgba(0,0,0,.38); color:#EAF6FF; } .timeline { display:grid; gap:16px; padding-left:8px; } .event { display:grid; grid-template-columns:52px 28px 1fr; align-items:center; gap:10px; } .event time { color:#6F7F96; font-family:var(--jarvis-font-mono); font-size:12px; } .event b { width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:rgba(56,213,255,.12); } .event.green b{color:#48E6A4;box-shadow:0 0 16px rgba(72,230,164,.28);} .event.blue b{color:#38D5FF;} .event.violet b{color:#8C7CFF;} .event.amber b{color:#F7C948;} .daily { margin-top:24px; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; } .daily h3 { grid-column:1/-1; margin:0 0 4px; color:#7CE7FF; letter-spacing:.12em; text-transform:uppercase; font-size:12px; } .daily p { margin:0; padding:14px; border-radius:16px; background:rgba(27,35,53,.58); border:1px solid rgba(124,231,255,.12); } .daily b { display:block; font-size:22px; } .daily span { color:#A9B7CA; font-size:11px; text-transform:uppercase; }
      - type: markdown
        view_layout: { grid-area: footer }
        content: |
          <div class="mc-footer">v0.3 · GitHub · © Jarvis Dashboard</div>
        card_mod:
          style: |
            ha-card { background:transparent; border:0; box-shadow:none; color:#6F7F96; text-align:center; font-size:12px; letter-spacing:.08em; }
