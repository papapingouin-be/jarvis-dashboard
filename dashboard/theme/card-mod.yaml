# Jarvis Dark card-mod baseline (v0.2)
# Include these snippets from Lovelace resources or copy the relevant style blocks
# into dashboard cards. This file defines generic visual language only.

jarvis_global:
  card_mod:
    style: |
      :host {
        --ha-card-background: var(--jarvis-card-background);
        --ha-card-border-radius: var(--jarvis-radius-lg);
        --ha-card-border-color: var(--jarvis-border-color);
        --ha-card-box-shadow: var(--jarvis-shadow-md), var(--jarvis-shadow-glow);
        color: var(--primary-text-color);
        font-family: var(--jarvis-font-family);
      }
      ha-card {
        position: relative;
        overflow: hidden;
        padding: var(--jarvis-card-padding);
        background: var(--jarvis-card-background);
        border: 1px solid var(--jarvis-border-color);
        border-radius: var(--jarvis-radius-lg);
        box-shadow: var(--jarvis-shadow-md), var(--jarvis-shadow-glow);
        backdrop-filter: blur(18px) saturate(130%);
        transition: background var(--jarvis-transition-normal), border-color var(--jarvis-transition-normal), box-shadow var(--jarvis-transition-normal), transform var(--jarvis-transition-fast);
      }
      ha-card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(124, 231, 255, 0.10), transparent 34%, rgba(140, 124, 255, 0.06));
        opacity: 0.72;
      }
      ha-card:hover {
        background: var(--jarvis-card-background-hover);
        border-color: var(--jarvis-border-hover);
        box-shadow: var(--jarvis-shadow-md), var(--jarvis-shadow-glow-hover);
        transform: translateY(-1px);
      }
      ha-card:active {
        transform: scale(0.99);
      }
      @media (max-width: 1023px) {
        :host { --jarvis-card-padding: 18px; --jarvis-card-gap: 16px; --jarvis-page-padding: 24px; }
      }
      @media (max-width: 767px) {
        :host { --jarvis-card-padding: 16px; --jarvis-card-gap: 12px; --jarvis-page-padding: 14px; }
        ha-card:hover { transform: none; }
      }

jarvis_titles:
  card_mod:
    style: |
      .card-header,
      h1, h2, h3,
      .name,
      .title {
        color: var(--primary-text-color);
        font-family: var(--jarvis-font-family);
        font-weight: 700;
        letter-spacing: var(--jarvis-letter-spacing-title);
        line-height: 1.15;
      }
      .card-header {
        padding: 0 0 var(--jarvis-space-4) 0;
      }
      .subtitle,
      .secondary,
      .description {
        color: var(--secondary-text-color);
        line-height: 1.45;
      }

jarvis_chips:
  card_mod:
    style: |
      ha-card,
      mushroom-chips-card {
        --chip-background: var(--jarvis-chip-background);
        --chip-border-radius: var(--jarvis-radius-pill);
        --chip-box-shadow: none;
        --chip-height: 36px;
        --chip-padding: 0 var(--jarvis-space-3);
        --chip-spacing: var(--jarvis-space-2);
      }
      mushroom-chip,
      ha-chip,
      .chip,
      .badge {
        border: 1px solid var(--jarvis-border-color);
        border-radius: var(--jarvis-radius-pill);
        color: var(--primary-text-color);
        transition: border-color var(--jarvis-transition-fast), background var(--jarvis-transition-fast), transform var(--jarvis-transition-fast);
      }
      mushroom-chip:hover,
      ha-chip:hover,
      .chip:hover,
      .badge:hover {
        border-color: var(--jarvis-border-hover);
        background: rgba(56, 213, 255, 0.10);
        transform: translateY(-1px);
      }

jarvis_mushroom:
  card_mod:
    style: |
      mushroom-card,
      mushroom-template-card,
      mushroom-entity-card,
      mushroom-light-card,
      mushroom-climate-card,
      mushroom-media-player-card {
        --mush-card-primary-color: var(--primary-text-color);
        --mush-card-secondary-color: var(--secondary-text-color);
        --mush-icon-size: 42px;
        --mush-icon-border-radius: var(--jarvis-radius-md);
        --mush-rgb-state-entity: 56, 213, 255;
        --mush-rgb-state-light: 247, 201, 72;
        --mush-rgb-state-fan: 72, 230, 164;
        --mush-rgb-state-cover: 140, 124, 255;
        --mush-spacing: var(--jarvis-space-3);
        font-family: var(--jarvis-font-family);
      }
      mushroom-shape-icon {
        --shape-color: rgba(56, 213, 255, 0.12);
        --shape-color-disabled: rgba(169, 183, 202, 0.08);
        --icon-color: var(--jarvis-color-core);
      }

jarvis_markdown:
  card_mod:
    style: |
      ha-card.type-markdown,
      ha-markdown,
      .markdown {
        color: var(--primary-text-color);
        font-family: var(--jarvis-font-family);
        line-height: 1.65;
      }
      ha-markdown h1,
      ha-markdown h2,
      ha-markdown h3,
      .markdown h1,
      .markdown h2,
      .markdown h3 {
        color: var(--primary-text-color);
        letter-spacing: var(--jarvis-letter-spacing-title);
      }
      ha-markdown code,
      .markdown code {
        color: var(--jarvis-color-core-soft);
        font-family: var(--jarvis-font-mono);
        background: rgba(56, 213, 255, 0.08);
        border: 1px solid var(--jarvis-border-color);
        border-radius: var(--jarvis-radius-xs, 6px);
        padding: 0.1rem 0.35rem;
      }
      ha-markdown hr,
      .markdown hr {
        border: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(124, 231, 255, 0.30), transparent);
      }

jarvis_entities:
  card_mod:
    style: |
      hui-entities-card {
        --paper-item-icon-color: var(--secondary-text-color);
        --paper-item-icon-active-color: var(--jarvis-color-core);
      }
      .entities .entity,
      hui-generic-entity-row,
      state-badge {
        color: var(--primary-text-color);
      }
      hui-generic-entity-row {
        border-radius: var(--jarvis-radius-md);
        margin: 2px 0;
        padding: var(--jarvis-space-2) var(--jarvis-space-3);
        transition: background var(--jarvis-transition-fast);
      }
      hui-generic-entity-row:hover {
        background: rgba(56, 213, 255, 0.07);
      }
      .secondary {
        color: var(--secondary-text-color);
      }

jarvis_separators:
  card_mod:
    style: |
      hr,
      .divider,
      hui-divider-row {
        border: 0;
        min-height: 1px;
        background: linear-gradient(90deg, transparent, rgba(124, 231, 255, 0.30), transparent);
        margin: var(--jarvis-space-4) 0;
      }
