# Home Assistant theme: Jarvis Dark (v0.2)
Jarvis Dark:
  # Core Home Assistant colors
  primary-color: "#38D5FF"
  accent-color: "#8C7CFF"
  dark-primary-color: "#1E8EA8"
  light-primary-color: "#7CE7FF"
  primary-background-color: "#05070D"
  secondary-background-color: "#080B14"
  divider-color: "rgba(124, 231, 255, 0.16)"
  disabled-color: "#6F7F96"

  # Text
  primary-text-color: "#EAF6FF"
  secondary-text-color: "#A9B7CA"
  text-primary-color: "#05070D"
  text-light-primary-color: "#EAF6FF"

  # App chrome
  app-header-background-color: "rgba(8, 11, 20, 0.92)"
  app-header-text-color: "#EAF6FF"
  app-header-selection-bar-color: "#38D5FF"
  app-toolbar-background-color: "rgba(8, 11, 20, 0.92)"
  sidebar-background-color: "#080B14"
  sidebar-icon-color: "#A9B7CA"
  sidebar-text-color: "#EAF6FF"
  sidebar-selected-background-color: "rgba(56, 213, 255, 0.10)"
  sidebar-selected-icon-color: "#38D5FF"
  sidebar-selected-text-color: "#EAF6FF"

  # Cards and controls
  card-background-color: "rgba(16, 21, 34, 0.84)"
  ha-card-background: "rgba(16, 21, 34, 0.84)"
  ha-card-border-color: "rgba(124, 231, 255, 0.16)"
  ha-card-border-radius: "22px"
  ha-card-box-shadow: "0 16px 40px rgba(0, 0, 0, 0.34), 0 0 0 1px rgba(56, 213, 255, 0.16), 0 0 24px rgba(56, 213, 255, 0.14)"
  paper-card-background-color: "rgba(16, 21, 34, 0.84)"
  paper-item-icon-color: "#A9B7CA"
  paper-item-icon-active-color: "#38D5FF"
  state-icon-color: "#A9B7CA"
  state-icon-active-color: "#38D5FF"

  # Inputs and buttons
  input-fill-color: "rgba(27, 35, 53, 0.76)"
  input-ink-color: "#EAF6FF"
  input-label-ink-color: "#A9B7CA"
  input-idle-line-color: "rgba(124, 231, 255, 0.16)"
  input-hover-line-color: "rgba(124, 231, 255, 0.36)"
  mdc-theme-primary: "#38D5FF"
  mdc-theme-secondary: "#8C7CFF"
  mdc-theme-surface: "#101522"
  mdc-theme-background: "#05070D"
  mdc-theme-on-primary: "#05070D"
  mdc-theme-on-secondary: "#05070D"
  mdc-theme-on-surface: "#EAF6FF"
  mdc-button-outline-color: "rgba(124, 231, 255, 0.24)"

  # Semantic states
  success-color: "#48E6A4"
  warning-color: "#F7C948"
  error-color: "#FF5C7A"
  info-color: "#38D5FF"

  # Jarvis custom CSS variables for card-mod and future cards
  jarvis-color-void: "#05070D"
  jarvis-color-shell: "#080B14"
  jarvis-color-surface: "#101522"
  jarvis-color-surface-raised: "#151B2B"
  jarvis-color-surface-overlay: "#1B2335"
  jarvis-color-border: "#2B3650"
  jarvis-color-border-strong: "#40506F"
  jarvis-color-text: "#EAF6FF"
  jarvis-color-text-muted: "#A9B7CA"
  jarvis-color-text-subtle: "#6F7F96"
  jarvis-color-core: "#38D5FF"
  jarvis-color-core-soft: "#7CE7FF"
  jarvis-color-violet: "#8C7CFF"
  jarvis-color-emerald: "#48E6A4"
  jarvis-color-amber: "#F7C948"
  jarvis-color-rose: "#FF6B9A"
  jarvis-page-background: "radial-gradient(circle at 20% 0%, rgba(56, 213, 255, 0.12), transparent 28%), radial-gradient(circle at 85% 15%, rgba(140, 124, 255, 0.10), transparent 26%), linear-gradient(180deg, #05070D 0%, #080B14 100%)"
  jarvis-card-background: "rgba(16, 21, 34, 0.84)"
  jarvis-card-background-hover: "rgba(21, 27, 43, 0.92)"
  jarvis-chip-background: "rgba(27, 35, 53, 0.76)"
  jarvis-border-color: "rgba(124, 231, 255, 0.16)"
  jarvis-border-hover: "rgba(124, 231, 255, 0.36)"
  jarvis-border-active: "rgba(56, 213, 255, 0.58)"
  jarvis-radius-sm: "10px"
  jarvis-radius-md: "16px"
  jarvis-radius-lg: "22px"
  jarvis-radius-xl: "28px"
  jarvis-radius-pill: "999px"
  jarvis-space-2: "8px"
  jarvis-space-3: "12px"
  jarvis-space-4: "16px"
  jarvis-space-5: "20px"
  jarvis-space-6: "24px"
  jarvis-shadow-md: "0 16px 40px rgba(0, 0, 0, 0.34)"
  jarvis-shadow-glow: "0 0 0 1px rgba(56, 213, 255, 0.16), 0 0 24px rgba(56, 213, 255, 0.14)"
  jarvis-shadow-glow-hover: "0 0 0 1px rgba(56, 213, 255, 0.30), 0 0 32px rgba(56, 213, 255, 0.20)"
  jarvis-font-family: "Inter, Roboto, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  jarvis-font-mono: "JetBrains Mono, 'Roboto Mono', SFMono-Regular, Consolas, monospace"
  jarvis-letter-spacing-title: "0.01em"
  jarvis-letter-spacing-label: "0.08em"
  jarvis-transition-fast: "140ms cubic-bezier(0.2, 0, 0, 1)"
  jarvis-transition-normal: "220ms cubic-bezier(0.2, 0, 0, 1)"
  jarvis-card-padding: "22px"
  jarvis-page-padding: "32px"
  jarvis-card-gap: "20px"
